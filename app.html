<script>// Tunnel shim: runs in the phone browser BEFORE the Command Center app.
// Routes the app's fetch() and WebSocket traffic for /api/* through the
// public EMQX MQTT broker, where the bridge on the VM forwards it to the
// local Command Center server. The session secret comes from the URL hash
// (#s=<secret>) so only the holder of the full link can connect.

  'use strict';

  function fatal(msg) {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.innerHTML =
        '<div style="font-family:system-ui;padding:40px;max-width:520px;margin:auto">' +
        '<h2>Command Center tunnel</h2><p>' + msg + '</p></div>';
    });
  }

  // delivered as a file, or supplied via the URL hash (#s=<secret>).

  var SECRET = (typeof window.__CC_TUNNEL_SECRET === 'string' && window.__CC_TUNNEL_SECRET) || (m && m[1]);

  var connected = false;

    var q = outQueue; outQueue = [];
    q.forEach(function (item) { client.publish(BASE + '/up/' + item[0], item[1], { qos: 0 }); });
  }

  // ---------- MQTT ----------
  function mqttConnect() {
    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      connectTimeout: 20000, reconnectPeriod: 4000, keepalive: 45,
      clientId: 'zccw-' + randHex(6),
    });
    client.on('connect', function () {
      connected = true;
      client.subscribe(BASE + '/down/#', { qos: 0 }, function () { flushQueue(); });
      updateStatus();
    });
    client.on('reconnect', function () { connected = false; updateStatus(); });
    client.on('close', function () { connected = false; updateStatus(); });
    client.on('error', function () { /* reconnect handles it */ });
    client.on('message', onDown);
  }

    var rest = topic.slice((BASE + '/down/').length);
    var parts = rest.split('/');

      if (!w) return;
      delete httpWaiters[parts[1]];
      clearTimeout(w.timer);

      if (kind === 'bin') { sess._onBin(new Uint8Array(payload)); return; }
